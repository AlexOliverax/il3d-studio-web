    <!-- Structured Data: FAQPage (Schema Rich Snippet) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Quanto custa uma impressão 3D?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "O valor de uma peça em 3D depende principalmente do tempo de máquina, quantidade de material (gramas de PLA) e acabamento. Nossos chaveiros e miniaturas começam em faixas muito acessíveis, e fornecemos o orçamento exato rapidamente pelo WhatsApp sem qualquer compromisso."
            }
          },
          {
            "@type": "Question",
            "name": "Vocês fazem peças personalizadas?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sim! Personalização é um dos nossos maiores pontos fortes. Conseguimos adicionar nomes, logotipos, frases, criar chaveiros personalizados, tags de identificação, troféus e adaptar modelos para a sua necessidade específica."
            }
          },
          {
            "@type": "Question",
            "name": "Posso escolher a cor?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Com certeza. Temos uma ampla variedade de cores em filamento PLA premium: rosa choque, amarelo vibrante, preto fosco, branco puro, azul metálico, cinza espacial, verde, dourado e combinações multicoloridas com o sistema AMS."
            }
          },
          {
            "@type": "Question",
            "name": "Qual material vocês usam?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Utilizamos principalmente o PLA (Poliácido Láctico) de alta qualidade. É um termoplástico biodegradável de origem vegetal, seguro, atóxico, inodoro e com acabamento de superfície limpo e preciso."
            }
          },
          {
            "@type": "Question",
            "name": "Vocês imprimem um arquivo STL ou 3MF que eu já tenho?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sim! Se você já tem o arquivo STL, 3MF ou OBJ baixado de plataformas como MakerWorld, Printables, Thingiverse ou Cults3D, basta nos enviar pelo WhatsApp para cotação."
            }
          },
          {
            "@type": "Question",
            "name": "Vocês criam o modelo 3D a partir de uma ideia ou foto?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Criamos modelos paramétricos como letreiros, chaveiros de nome, suportes técnicos e adaptações funcionais. Para esculturas complexas, avaliamos caso a caso a viabilidade técnica."
            }
          },
          {
            "@type": "Question",
            "name": "Quanto tempo demora?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Peças unitárias em catálogo geralmente levam de 1 a 3 dias úteis para impressão e acabamento. Para pedidos maiores alinhamos o cronograma com antecedência ao evento."
            }
          },
          {
            "@type": "Question",
            "name": "Vocês fazem lembrancinhas em quantidade?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sim, produzimos lotes para aniversários, batizados, formaturas e eventos empresariais em São Paulo com condições especiais de orçamento."
            }
          },
          {
            "@type": "Question",
            "name": "Como funciona a retirada ou entrega?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Atendemos em São Paulo - SP. Você pode optar por retirada combinada no ponto de encontro ou envio via Uber Flash, Correios ou transportadora com frete a combinar."
            }
          }
        ]
      }
    </script>
