name: Gestão and storefront checks
on:
  pull_request:
  push:
    branches: [feat/gestao-v1]
permissions:
  contents: read
jobs:
  management:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r management/requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest management/tests -q
      - run: python -m pytest management/tests/browser_flow.py -q
  storefront:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: node --check management/static/app.js
